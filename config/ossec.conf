<!-- /var/ossec/etc/ossec.conf (Wazuh manager) -->

<command>
  <name>misp-active-response</name>
  <executable>misp-ar.exe</executable>
  <timeout_allowed>yes</timeout_allowed>
</command>

<!-- Malicious domains -->
<active-response>
  <disabled>no</disabled>
  <command>misp-active-response</command>
  <location>local</location>
  <rules_id>200003</rules_id>
  <timeout>10</timeout>
</active-response>

<!-- Malicious SHA256 hashes -->
<active-response>
  <disabled>no</disabled>
  <command>misp-active-response</command>
  <location>local</location>
  <rules_id>200004</rules_id>
  <timeout>10</timeout>
</active-response>
